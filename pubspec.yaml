name: thought_circle
description: A calm, private Flutter app for turning looping thoughts into small next steps with on-device Gemma.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  flutter_gemma: ^1.3.2
  flutter_gemma_litertlm: ^1.2.0
  flutter_markdown_plus: ^1.0.12
  path_provider: ^2.1.6
  record: ^7.1.1
  sqlite3: ^3.3.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
        - asset: assets/fonts/Newsreader-Italic-Variable.ttf
          style: italic
