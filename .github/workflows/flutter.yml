name: Flutter checks

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add temporary platform scaffold
        run: |
          scratch="$(mktemp -d)"
          flutter create \
            --project-name thought_circle \
            --org com.thoughtcircle \
            --platforms=android,linux \
            "$scratch/scaffold"
          cp -R "$scratch/scaffold/android" .
          cp -R "$scratch/scaffold/linux" .
          cp "$scratch/scaffold/.metadata" .
      - run: dart run tool/configure_platforms.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
